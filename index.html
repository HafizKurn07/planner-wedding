<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8C3A66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner Nikah">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Planner Pernikahan Kita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500..700&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout: satu kolom mobile, kartu putih di atas latar blush, hero mulberry, tab bar bawah. */
:root{
  --bg:#F6F3F5; --sf:#FFFFFF; --sf2:#F0EAEE; --ink:#241A29; --ink2:#6B5D72; --line:#E4DBE2;
  --ac:#8C3A66; --acink:#FFFFFF; --acsoft:#F3E1EB;
  --good:#3C7A60; --goodsoft:#DFEFE6; --warn:#946414; --warnsoft:#F8ECCD; --bad:#B0314A; --badsoft:#F9DFE4;
  --shadow:0 1px 2px rgba(36,26,41,.06),0 8px 24px rgba(36,26,41,.06);
  --scrim:rgba(36,26,41,.45);
  --fd:'Bodoni Moda','Bodoni 72','Didot',Georgia,serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151018; --sf:#1F1823; --sf2:#2A2130; --ink:#F2EAF3; --ink2:#AD9EB4; --line:#372C3E;
    --ac:#D88AB2; --acink:#2A0F1E; --acsoft:#3A2332;
    --good:#7CC6A0; --goodsoft:#1F3328; --warn:#E0B65C; --warnsoft:#3A2F16; --bad:#F08093; --badsoft:#3E1B24;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151018; --sf:#1F1823; --sf2:#2A2130; --ink:#F2EAF3; --ink2:#AD9EB4; --line:#372C3E;
  --ac:#D88AB2; --acink:#2A0F1E; --acsoft:#3A2332;
  --good:#7CC6A0; --goodsoft:#1F3328; --warn:#E0B65C; --warnsoft:#3A2F16; --bad:#F08093; --badsoft:#3E1B24;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
.app{max-width:520px;margin:0 auto;padding-bottom:112px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 14px}
.top .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.top h1{font-family:var(--fd);font-weight:600;font-size:28px;line-height:1.1;text-wrap:balance}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--sf);color:var(--ac);display:grid;place-items:center;position:relative}
.avatar svg{width:22px;height:22px}
.dot{position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);background:var(--ink2)}
.dot.ok{background:var(--good)} .dot.saving{background:var(--warn)} .dot.err{background:var(--bad)}
.ph{padding:10px 0 14px;display:flex;flex-direction:column;gap:4px}
.ph h1{font-family:var(--fd);font-weight:600;font-size:30px;line-height:1.1}
.ph .sub{color:var(--ink2)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--ac);font-weight:600;padding:10px 0;min-height:44px}
.back svg{width:18px;height:18px}
.phrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

/* surfaces */
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--sf);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h2,.sec h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin-bottom:10px}
.sec{margin-top:22px}
.sec>h2{margin-left:2px}
.hero{background:var(--ac);color:var(--acink);border-radius:22px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:2px}
.hero .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.85}
.hero .big{font-family:var(--fd);font-weight:600;font-size:84px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px}
.hero .herosub{font-size:16px;font-weight:500}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .meta span{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
:root[data-theme="dark"] .hero .meta span{background:rgba(42,15,30,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .meta span{background:rgba(42,15,30,.14)}}
.notice{background:var(--acsoft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.notice p{font-size:14px}
.notice .acts{display:flex;gap:8px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.big2{font-family:var(--fd);font-weight:600;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.ringwrap{position:relative;flex:none}
.ringwrap .rl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ac)}
.bar.good i{background:var(--good)}
.bar.bad i{background:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--sf);border-radius:16px;padding:14px;text-align:left;border:0;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .tl{font-size:12px;color:var(--ink2);font-weight:600}
.tile .tv{font-family:var(--fd);font-weight:600;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .ts{font-size:12px;color:var(--ink2)}

/* pills & buttons */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--sf2);color:var(--ink2)}
.pill.good{background:var(--goodsoft);color:var(--good)}
.pill.warn{background:var(--warnsoft);color:var(--warn)}
.pill.bad{background:var(--badsoft);color:var(--bad)}
.pill.ac{background:var(--acsoft);color:var(--ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--ac);color:var(--acink);font-weight:600}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--bad);color:#fff}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--sf);color:var(--ink2);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sf);color:var(--ink2);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--acsoft);border-color:var(--ac);color:var(--ac)}

/* forms */
.lb{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);min-width:0}
.inp{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--sf);color:var(--ink);padding:0 12px;font:inherit;font-size:16px;font-weight:500;min-width:0}
textarea.inp{padding:10px 12px;min-height:76px;resize:vertical;line-height:1.4}
select.inp{appearance:auto}
.fld{position:relative;display:block}
.fld .pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink2);font-size:14px;font-weight:600;pointer-events:none}
.fld .inp{padding-left:38px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/-1}
.form{display:flex;flex-direction:column;gap:14px}
input[type=range]{width:100%;accent-color:var(--ac);min-height:36px}
.ro{min-height:46px;border-radius:12px;background:var(--sf2);padding:0 12px;display:flex;align-items:center;font-weight:600;font-variant-numeric:tabular-nums}

/* accordion rows */
.acc{background:var(--sf);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.acchead{width:100%;display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;background:none;border:0;text-align:left;color:inherit;min-height:60px}
.acchead .hz{flex:1;min-width:0;display:block}
.acchead .chev{flex:none;width:18px;height:18px;color:var(--ink2);transition:transform .2s}
.acc.open .chev{transform:rotate(90deg)}
.accbody{display:none;padding:2px 16px 16px;border-top:1px solid var(--line);padding-top:14px}
.acc.open .accbody{display:flex;flex-direction:column;gap:14px}
.hz .t1{font-weight:600;display:block}
.hz .t2{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.hz .bar{margin-top:8px;height:6px}

/* checklist */
.trow{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 8px}
.chk{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--acink)}
.chk span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--sf)}
.chk.mid span{border-color:var(--warn);background:var(--warnsoft)}
.chk.on span{border-color:var(--good);background:var(--good)}
.chk svg{width:15px;height:15px;opacity:0}
.chk.on svg{opacity:1}
.rowtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;background:none;border:0;text-align:left;padding:8px 10px 8px 2px;min-height:48px;justify-content:center}
.rt{font-weight:600}
.rt.done{color:var(--ink2);text-decoration:line-through}
.rm{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fase{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.fase h2{margin:0}
.fase span{font-size:13px;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}

/* more list */
.link{display:flex;align-items:center;gap:14px;padding:16px;background:var(--sf);border-radius:16px;box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.link .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--acsoft);color:var(--ac);display:grid;place-items:center}
.link .ic svg{width:22px;height:22px}
.link b{display:block}
.link .chev{width:18px;height:18px;color:var(--ink2);flex:none}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:24px 16px;text-align:center;color:var(--ink2)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--line);z-index:20;
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border:0;background:none;color:var(--ink2);font-size:11px;font-weight:600}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ac)}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:none;
  padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet.on{display:block}
.sheetin{max-width:520px;margin:0 auto;background:var(--sf);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheetin h2{font-family:var(--fd);font-weight:600;font-size:24px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px);display:none}
.toast.on{display:block}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}

/* layar masuk */
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.gatein{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.gatein h1{font-family:var(--fd);font-weight:600;font-size:34px;line-height:1.1;text-wrap:balance}
.gatein .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-bottom:6px}
.gatein p{color:var(--ink2)}
.gerr{color:var(--bad);font-weight:600;font-size:14px;min-height:20px}
</style>
</head>
<body>

<div class="gate" id="gate"><div class="gatein">
<div><div class="eyebrow">Planner pernikahan</div><h1>Planner Pernikahan Kita</h1></div>
<p id="gmsg">Memuat...</p>
<form id="lform" class="form" hidden>
<label class="lb"><span>Email</span><input class="inp" id="gemail" type="email" autocomplete="email" inputmode="email" required></label>
<label class="lb"><span>Kata sandi</span><input class="inp" id="gpass" type="password" autocomplete="current-password" required></label>
<button class="btn" id="gbtn" type="submit">Masuk</button>
</form>
<div class="gerr" id="gerr" role="alert"></div>
<button class="btn ghost" id="gout" type="button" hidden>Keluar</button>
</div></div>
<div class="app" id="app">
  <main id="view"></main>
</div>
<nav class="tabbar" aria-label="Menu utama"><div class="tabs" id="tabs"></div></nav>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheetin" id="sheetin"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="filein" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
/* ---------- util ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var num=function(v){var n=Number(v);return isFinite(n)?n:0};
var p2=function(n){return (n<10?'0':'')+n};
var nf=new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
var rp=function(n){return (n<0?'-':'')+'Rp '+nf.format(Math.abs(Math.round(n)))};
function rpS(n){var a=Math.abs(n),s=n<0?'-':'';
  if(a>=1e9)return s+'Rp '+(a/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' M';
  if(a>=1e6)return s+'Rp '+(a/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt';
  if(a>=1e3)return s+'Rp '+(a/1e3).toLocaleString('id-ID',{maximumFractionDigits:0})+' rb';
  return s+'Rp '+Math.round(a)}
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var WD=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function pd(s){if(!s)return null;var a=String(s).split('-').map(Number);if(!a[0])return null;return new Date(a[0],(a[1]||1)-1,a[2]||1,12)}
function fd(d){return d?d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear():'-'}
function fm(d){return MON[d.getMonth()]+' '+d.getFullYear()}
function ymStr(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)}
function addM(d,n){var y=d.getFullYear(),m=d.getMonth()+n,last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d.getDate(),last),12)}
function today(){var t=new Date();t.setHours(12,0,0,0);return t}
function nextMonth(){var t=new Date();return ymStr(new Date(t.getFullYear(),t.getMonth()+1,1,12))}
function isObj(o){return o&&typeof o==='object'&&!Array.isArray(o)}
function merge(a,b){
  if(!isObj(a)||!isObj(b))return b===undefined?clone(a):b;
  var r={},k;for(k in a)r[k]=clone(a[k]);
  for(k in b){r[k]=(k in a&&isObj(a[k])&&isObj(b[k]))?merge(a[k],b[k]):b[k]}
  return r}
function pill(t,k){return '<span class="pill '+(k||'')+'">'+esc(t)+'</span>'}

/* ---------- icons ---------- */
var IC={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 pie:'<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15.5 3.6A9 9 0 0 1 20.4 8.5H15.5z"/>',
 coins:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
 check:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
 grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
 home2:'<path d="M3 21V9l9-6 9 6v12z"/><path d="M9 21v-7h6v7"/>',
 store:'<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5 12v8h14v-8"/>',
 tick:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};

var K=null;
function C(){
  var p=S.profile,b=S.budget,sv=S.savings;
  var total=num(p.total),opening=num(p.opening),date=pd(p.date),start=pd((p.start||'')+'-01'),now=today();
  var days=date?Math.max(0,Math.round((date-now)/864e5)):null;
  var months=1;
  if(date&&start)months=Math.min(48,Math.max(1,(date.getFullYear()-start.getFullYear())*12+date.getMonth()-start.getMonth()));
  var monthly=Math.max(0,(total-opening)/months),share=num(p.share)/100;
  var rows=[],cum=opening,i;
  for(i=1;i<=months;i++){
    var ym=start?ymStr(addM(start,i-1)):'',e=sv.e[ym]||{};
    var has=['a','b','c'].some(function(k){return e[k]!==undefined&&e[k]!==''});
    var tot=num(e.a)+num(e.b)+num(e.c);cum+=tot;
    rows.push({i:i,ym:ym,has:has,tot:has?tot:null,cum:cum,target:Math.min(total,opening+monthly*i)})}
  var sa=0,sb=0,sc=0,cnt=0;
  Object.keys(sv.e).forEach(function(k){var e=sv.e[k];sa+=num(e.a);sb+=num(e.b);sc+=num(e.c);if(['a','b','c'].some(function(x){return e[x]!==undefined&&e[x]!==''}))cnt++});
  var collected=opening+sa+sb+sc;
  var diff=start?(now.getFullYear()-start.getFullYear())*12+now.getMonth()-start.getMonth():0;
  var idx=Math.min(months,Math.max(0,diff));
  var expected=Math.min(total,opening+monthly*idx);
  var cats=CATS.map(function(c){
    var k=c[0],pct=num(b.pct[k]),est=(b.est[k]===undefined||b.est[k]==='')?null:num(b.est[k]),paid=num(b.paid[k]);
    var st=est===null?'Belum ada estimasi':(est>0&&paid>=est?'Lunas':(paid>0?'Sebagian':'Belum bayar'));
    return {k:k,name:c[1],pct:pct,alloc:total*pct/100,est:est,paid:paid,st:st}});
  var sumPct=0,sumAlloc=0,sumEst=0,sumPaid=0;
  cats.forEach(function(c){sumPct+=c.pct;sumAlloc+=c.alloc;sumEst+=c.est||0;sumPaid+=c.paid});
  var tasks=TASKS.map(function(t,i){
    var id='t'+(i+1),st=S.checklist.st[id]||'belum',due=date?addM(date,-t[2]):null;
    return {id:id,fase:t[0],txt:t[1],bln:t[2],st:st,due:due,late:st!=='selesai'&&!!due&&due<now}});
  var tdone=tasks.filter(function(t){return t.st==='selesai'}).length;
  var agreed=QS.filter(function(q,i){return S.talk.st['q'+(i+1)]==='Sepakat'}).length;
  var emergency=num(S.after.spend)*num(S.after.months);
  var aitems=AFTER.map(function(a){
    var tgt=a[0]==='a1'?emergency:((S.after.tgt[a[0]]===undefined||S.after.tgt[a[0]]==='')?null:num(S.after.tgt[a[0]]));
    var got=num(S.after.got[a[0]]);
    var st=(tgt===null||tgt===0)?'':(got>=tgt?'Tercapai':(got>0?'Menabung':'Belum mulai'));
    return {id:a[0],name:a[1],cat:a[2],tgt:tgt,got:got,st:st,pct:(tgt?Math.min(1,got/tgt):0)}});
  var vs=S.vendors.list,vPrice=0,vDp=0;
  vs.forEach(function(v){if(v.status!=='Batal'){vPrice+=num(v.price);vDp+=num(v.dp)}});
  return {total:total,opening:opening,date:date,start:start,now:now,days:days,months:months,monthly:monthly,share:share,rows:rows,
    sa:sa,sb:sb,sc:sc,cnt:cnt,collected:collected,expected:expected,cats:cats,sumPct:sumPct,sumAlloc:sumAlloc,sumEst:sumEst,sumPaid:sumPaid,
    tasks:tasks,tdone:tdone,agreed:agreed,emergency:emergency,aitems:aitems,vPrice:vPrice,vDp:vDp}}

var TABS=[['home','Beranda','home'],['budget','Anggaran','pie'],['savings','Tabungan','coins'],['tasks','Tugas','check'],['more','Lainnya','grid']];
function tabOf(r){return ['talk','after','vendors','profile'].indexOf(r)>=0?'more':r}
function drawTabs(){$('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab" type="button" data-act="go" data-to="'+t[0]+'"'+(tabOf(route)===t[0]?' aria-current="page"':'')+'>'+ico(t[2])+'<span>'+t[1]+'</span></button>'}).join('')}
function render(){K=C();$('#view').innerHTML=V[route]();drawTabs();refreshZones()}
function go(r){route=r;render();try{window.scrollTo(0,0)}catch(e){}}
var pendingRender=false;
function softRender(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||$('#sheet').classList.contains('on')){pendingRender=true;return}render()}
document.addEventListener('focusout',function(){if(pendingRender){setTimeout(function(){var a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))&&!$('#sheet').classList.contains('on')){pendingRender=false;render()}},60)}});

/* ---------- toast + sheet ---------- */
var tt=null;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2600)}
function openSheet(h){$('#sheetin').innerHTML=h;$('#sheet').classList.add('on');$('#scrim').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');if(pendingRender){pendingRender=false;render()}}
function confirmSheet(title,msg,act,label){openSheet('<h2>'+esc(title)+'</h2><p class="muted">'+esc(msg)+'</p><div class="grid2"><button class="btn ghost" data-act="close" type="button">Batal</button><button class="btn danger" data-act="'+act+'" type="button">'+esc(label)+'</button></div>')}

var db=null,canWrite=true,snapReady=false,remoteEmpty=false,dirty={},timers={},inflight={};
function setSync(s){syncState=s;refreshZones()}
function markDirty(sec){dirty[sec]=(dirty[sec]||0)+1;clearTimeout(timers[sec]);timers[sec]=setTimeout(function(){flush(sec)},700);if(syncState!=='local')syncState='saving'}
function flush(sec){
  if(!db||!canWrite)return;
  if(inflight[sec]){timers[sec]=setTimeout(function(){flush(sec)},400);return}
  var ver=dirty[sec];if(!ver)return;
  inflight[sec]=true;
  db.doc('plan/'+sec).set(clone(S[sec])).then(function(){
    if(dirty[sec]===ver)dirty[sec]=0;
    inflight[sec]=false;
    if(dirty[sec])timers[sec]=setTimeout(function(){flush(sec)},300);
    else if(!Object.keys(dirty).some(function(k){return dirty[k]}))setSync('ok')
  }).catch(function(e){
    inflight[sec]=false;
    if(e&&e.code==='invalid_argument'){canWrite=false;setSync('local');toast('Akun ini tidak punya izin edit. Perubahan hanya tersimpan di perangkat ini.')}
    else{setSync('err');timers[sec]=setTimeout(function(){flush(sec)},4000)}
  })}
function writeAll(){SECTIONS.forEach(markDirty)}
function commit(sec){
  saveLocal();
  if(db&&canWrite){if(remoteEmpty){remoteEmpty=false;writeAll()}else markDirty(sec)}
  refreshZones()}
function initDb(){
  if(!window.claude||!window.claude.use){syncState='local';return}
  window.claude.use('db').then(function(d){
    if(!d){syncState='local';refreshZones();return}
    db=d;
    db.collection('plan').onSnapshot(function(snap){
      var had=snap.docs.length>0,changed=false;
      remoteEmpty=!had;
      if(had){SECTIONS.forEach(function(sec){
        if(dirty[sec]||inflight[sec])return;
        var d0=null;snap.docs.forEach(function(x){if(x.id===sec)d0=x});
        var nv=(d0&&d0.exists)?merge(blank()[sec],clone(d0.data())):blank()[sec];
        if(JSON.stringify(nv)!==JSON.stringify(S[sec])){S[sec]=nv;changed=true}})}
      if(!snapReady){snapReady=true;syncState=canWrite?'ok':'local'}
      if(changed){saveLocal();softRender()}
      refreshZones()
    },function(){db=null;syncState='local';refreshZones()})
  }).catch(function(){syncState='local'})}

/* ---------- events ---------- */
function onInput(e){
  var el=e.target;if(!el||!el.matches||!el.matches('input,select,textarea'))return;
  var t=el.dataset.t,v=el.value;
  if(t==='money'){var d=v.replace(/\D/g,'').slice(0,13);v=d===''?'':Number(d);var f0=d===''?'':nf.format(v);if(el.value!==f0)el.value=f0}
  else if(t==='num'){v=v===''?'':num(v)}
  var f=el.dataset.f;if(!f)return;
  commit(setPath(f,v));
  if(f==='profile.start'&&route==='savings'&&el.type==='month'&&/^\d{4}-\d{2}$/.test(v)){render()}}
document.addEventListener('input',onInput);
document.addEventListener('change',function(e){if(e.target&&e.target.matches&&e.target.matches('select,input[type=date],input[type=month]'))onInput(e)});

function setStatus(sec,key,id,v){S[sec][key][id]=v;commit(sec)}
var ACT={
 go:function(t){closeSheet();go(t.dataset.to)},
 talk:function(){go('talk')},
 acc:function(t){var a=t.closest('.acc');if(!a)return;var on=a.classList.toggle('open'),id=a.dataset.id;if(id){on?OPEN.add(id):OPEN.delete(id)}},
 tcheck:function(t){var id=t.dataset.id,cur=S.checklist.st[id]||'belum';setStatus('checklist','st',id,cur==='selesai'?'belum':'selesai');if(t.dataset.home)render();else{var l=$('#tlist');if(l){l.innerHTML=taskList();refreshZones()}}},
 tset:function(t){setStatus('checklist','st',t.dataset.id,t.dataset.v);var l=$('#tlist');if(l&&fTask!=='all'){l.innerHTML=taskList();refreshZones()}},
 tfilter:function(t){fTask=t.dataset.v;$('#tchips').innerHTML=tchips();$('#tlist').innerHTML=taskList();refreshZones()},
 qset:function(t){setStatus('talk','st',t.dataset.id,t.dataset.v)},
 qfilter:function(t){fQ=t.dataset.v;$('#qchips').innerHTML=qchips();$('#qlist').innerHTML=qList();refreshZones()},
 cater:function(){var v=num(S.profile.guests)*num(S.profile.price);if(!v){toast('Isi jumlah tamu dan harga porsi di Profil dulu.');return}S.budget.est.catering=v;commit('budget');render()},
 theme:function(t){var v=t.dataset.v;try{localStorage.setItem('ppk.theme',v)}catch(e){}applyTheme();render()},
 exclear:function(){confirmSheet('Mulai dari nol?','Semua data contoh dihapus dan kamu bisa mengisi dari awal.','exclearok','Ya, mulai dari nol')},
 exclearok:function(){S=blank();saveLocal();if(db&&canWrite)writeAll();remoteEmpty=false;closeSheet();render();toast('Siap diisi')},
 exkeep:function(){S.profile.ex=false;commit('profile');if(db&&canWrite)writeAll();render()},
 reset:function(){confirmSheet('Hapus semua data?','Seluruh isian di aplikasi ini akan dihapus. Unduh cadangan dulu bila perlu.','resetok','Hapus semua')},
 resetok:function(){S=blank();saveLocal();if(db&&canWrite)writeAll();remoteEmpty=false;closeSheet();go('home');toast('Data dihapus')},
 close:function(){closeSheet()},
 signout:function(){if(window.__ppkSignOut)window.__ppkSignOut()},
 export:function(){
  var data=JSON.stringify({app:'planner-pernikahan-kita',v:1,data:S},null,1);
  if(!window.claude||!window.claude.use){toast('Unduhan tidak tersedia di tampilan ini.');return}
  window.claude.use('downloads').then(function(dl){
    if(!dl){toast('Unduhan tidak tersedia di tampilan ini.');return}
    return dl.save({filename:'cadangan-planner-pernikahan.json',data:data}).then(function(){toast('Cadangan disimpan')})
  }).catch(function(e){if(!e||e.code!=='declined')toast('Cadangan belum tersimpan.')})},
 import:function(){$('#filein').click()},
 vadd:function(){vendorSheet(null)},
 vedit:function(t){vendorSheet(t.dataset.id)},
 vsave:function(t){
  var g=function(id){return $('#'+id).value},mny=function(id){var d=g(id).replace(/\D/g,'');return d===''?'':Number(d)};
  var name=g('vf-name').trim();if(!name){toast('Isi nama vendor dulu.');return}
  var rec={id:t.dataset.id||('v'+Date.now().toString(36)),cat:g('vf-cat'),name:name,contact:g('vf-contact').trim(),price:mny('vf-price'),dp:mny('vf-dp'),due:g('vf-due'),status:g('vf-status'),note:g('vf-note').trim()};
  var l=S.vendors.list,i=-1;l.forEach(function(x,j){if(x.id===rec.id)i=j});
  if(i>=0)l[i]=rec;else l.push(rec);
  commit('vendors');closeSheet();if(route==='vendors'){$('#vlist').innerHTML=vendorList();refreshZones()}toast('Vendor tersimpan')},
 vdel:function(t){confirmSheet('Hapus vendor?','Vendor ini akan dihapus dari daftar.','vdelok','Hapus');$('#sheetin').querySelector('[data-act=vdelok]').dataset.id=t.dataset.id},
 vdelok:function(t){S.vendors.list=S.vendors.list.filter(function(x){return x.id!==t.dataset.id});commit('vendors');closeSheet();if(route==='vendors'){$('#vlist').innerHTML=vendorList();refreshZones()}toast('Vendor dihapus')}
};
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-act]');if(!t)return;var f=ACT[t.dataset.act];if(f){if(t.tagName==='A')e.preventDefault();f(t,e)}});

function vendorSheet(id){
  var v=id?S.vendors.list.filter(function(x){return x.id===id})[0]:null;
  v=v||{cat:'Venue',name:'',contact:'',price:'',dp:'',due:'',status:'Survei',note:''};
  var sel=function(arr,cur,idd){return '<select class="inp" id="'+idd+'">'+arr.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'};
  var mi=function(idd,val){return '<label class="fld"><span class="pre">Rp</span><input class="inp" id="'+idd+'" data-t="money" inputmode="numeric" autocomplete="off" value="'+((val===''||val==null)?'':nf.format(num(val)))+'" placeholder="0"></label>'};
  openSheet('<h2>'+(id?'Ubah vendor':'Tambah vendor')+'</h2><div class="form">'+
    '<div class="grid2">'+lab('Kategori',sel(VCATS,v.cat,'vf-cat'))+lab('Status',sel(VSTAT,v.status,'vf-status'))+'</div>'+
    lab('Nama vendor','<input class="inp" id="vf-name" type="text" value="'+esc(v.name)+'" placeholder="Nama vendor">')+
    lab('Kontak','<input class="inp" id="vf-contact" type="text" value="'+esc(v.contact)+'" placeholder="Nomor atau akun">')+
    '<div class="grid2">'+lab('Harga paket',mi('vf-price',v.price))+lab('DP dibayar',mi('vf-dp',v.dp))+'</div>'+
    lab('Jatuh tempo pelunasan','<input class="inp" id="vf-due" type="date" value="'+esc(v.due)+'">')+
    lab('Catatan','<input class="inp" id="vf-note" type="text" value="'+esc(v.note)+'" placeholder="Opsional">')+
    '<div class="grid2"><button class="btn ghost" data-act="close" type="button">Batal</button><button class="btn" data-act="vsave" data-id="'+(id||'')+'" type="button">Simpan</button></div>'+
    (id?'<button class="btn ghost wide" data-act="vdel" data-id="'+id+'" type="button" style="color:var(--bad)">Hapus vendor</button>':'')+'</div>')}

$('#filein').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(String(r.result));if(!o||!isObj(o.data))throw 0;S=merge(blank(),o.data);saveLocal();if(db&&canWrite)writeAll();remoteEmpty=false;render();toast('Cadangan dipulihkan')}catch(x){toast('File cadangan tidak valid.')}};
  r.onerror=function(){toast('File tidak bisa dibaca.')};
  r.readAsText(f)});

function applyTheme(){var t='auto';try{t=localStorage.getItem('ppk.theme')||'auto'}catch(e){}var r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme')}

/* ---------- boot ---------- */
applyTheme();
window.__ppkStart=function(){loadLocal();render();initDb()};
})();
</script>


<script src="firebase-config.js"></script>
<script>
setTimeout(function(){if(!window.__ppkReady){var m=document.getElementById('gmsg');if(m)m.textContent='Tidak bisa memuat. Periksa koneksi internet lalu muat ulang halaman.'}},12000);
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,getFirestore,doc,setDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const q=s=>document.querySelector(s);
const gate=q('#gate'),gmsg=q('#gmsg'),gerr=q('#gerr'),lform=q('#lform'),gbtn=q('#gbtn'),gout=q('#gout');
function show(msg,o){o=o||{};gate.hidden=false;gmsg.textContent=msg;lform.hidden=!o.form;gout.hidden=!o.out}

const cfg=window.FIREBASE_CONFIG;
const configured=cfg&&cfg.apiKey&&cfg.projectId&&!/ISI/.test(cfg.apiKey+cfg.projectId);

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}

if(!configured){
  window.__ppkReady=true;
  show('Konfigurasi Firebase belum diisi. Buka file firebase-config.js dan tempel konfigurasi dari Firebase Console.');
}else{
  const app=initializeApp(cfg);
  const auth=getAuth(app);
  let fs;
  try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}
  catch(e){fs=getFirestore(app)}

  const toErr=e=>({code:(e&&e.code==='permission-denied')?'invalid_argument':((e&&e.code)||'unavailable'),message:e&&e.message});
  function denied(){window.__ppkReady=true;show('Akun ini belum diizinkan membuka data. Pastikan UID akun sudah dimasukkan di aturan Firestore, lalu coba lagi.',{out:true})}

  const dbShim={
    doc:p=>({set:d=>setDoc(doc(fs,p),d).catch(e=>{throw toErr(e)})}),
    collection:n=>({onSnapshot:(next,err)=>onSnapshot(collection(fs,n),snap=>{
      if(snap.metadata.fromCache&&snap.empty)return;
      next({docs:snap.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()}))});
    },e=>{if(e&&e.code==='permission-denied')denied();if(err)err(toErr(e))})})
  };
  const dlShim={save:o=>new Promise((res,rej)=>{
    try{
      const b=new Blob([o.data],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),4000);res({status:'saved'});
    }catch(e){rej({code:'unavailable'})}
  })};
  window.claude={use:async n=>n==='db'?dbShim:(n==='downloads'?dlShim:null)};

  const doOut=()=>signOut(auth).then(()=>location.reload());
  gout.addEventListener('click',doOut);
  window.__ppkSignOut=doOut;

  let started=false;
  onAuthStateChanged(auth,user=>{
    window.__ppkReady=true;
    if(!user){show('Masuk dengan akun yang sudah dibuat untuk kalian berdua.',{form:true});return}
    window.__ppkUser=user.email;
    window.__ppkLS='ppk.v2.'+user.uid;
    if(!started){started=true;gate.hidden=true;window.__ppkStart()}
  });

  const MSG={
    'auth/invalid-credential':'Email atau kata sandi salah.',
    'auth/wrong-password':'Email atau kata sandi salah.',
    'auth/user-not-found':'Email atau kata sandi salah.',
    'auth/invalid-email':'Format email tidak valid.',
    'auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.',
    'auth/network-request-failed':'Tidak ada koneksi internet.'
  };
  lform.addEventListener('submit',async e=>{
    e.preventDefault();gerr.textContent='';gbtn.disabled=true;
    try{await signInWithEmailAndPassword(auth,q('#gemail').value.trim(),q('#gpass').value)}
    catch(err){gerr.textContent=MSG[err&&err.code]||'Gagal masuk. Coba lagi.'}
    finally{gbtn.disabled=false}
  });
}
</script>
